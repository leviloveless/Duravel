# The iPhone app's build, run on Codemagic's Macs (2026-09-28).
#
# No Mac is needed anywhere in this: Codemagic checks out the repo, builds the
# Xcode project in ios/, signs it with Duravel's Apple Distribution certificate
# and uploads it to TestFlight. Setup, once: docs/ios/IOS_SETUP.md.
#
# Start a build from the Codemagic dashboard ("Start new build" → ios-testflight).
# It does not run on every push: the app loads duravel.app live, so a web deploy
# already reaches it — only native changes (ios/, capacitor.config.ts, the icon)
# need a new build.

workflows:
  ios-testflight:
    name: iPhone app → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      # The App Store Connect API key added in Codemagic → Team settings →
      # Integrations. The name here must match the name given there.
      app_store_connect: Duravel App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.duravel
      node: 22
      xcode: latest
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy the shell and plugins into the Xcode project
        script: npx cap sync ios
      - name: Apply the signing profile
        script: xcode-project use-profiles
      - name: Set the build number
        # Codemagic's own counter only ever goes up, which is all TestFlight asks.
        script: |
          perl -pi -e "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" \
            ios/App/App.xcodeproj/project.pbxproj
      - name: Build the app
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploaded builds reach INTERNAL testers (your App Store Connect team)
        # without review. Set this to true once App Store Connect → TestFlight →
        # Test Information is filled in, to send each build to Apple's beta
        # review for EXTERNAL testers and the public TestFlight link on /ios.
        submit_to_testflight: false
